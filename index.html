<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コンテキスト日記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2f6f8f">
<!-- 読み込めるものを、このアプリ自身とGoogleのログイン・ドライブ・Geminiだけに絞る(万一の書き換え・混入への備え) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://generativelanguage.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <span class="title">コンテキスト日記</span>
  <button id="syncBtn" class="sync" type="button">…</button>
</header>

<main>
  <div id="browserNotice" class="notice" hidden>
    いまSafariの中で開いています。ここで書いた内容や問いは、ホーム画面の「日記」アイコンのアプリとは別に保存されます。ホーム画面の「日記」アイコンから開き直してください。
  </div>
  <!-- 記入 -->
  <section id="view-write" class="view">
    <div id="qcard" class="qcard">
      <div class="qlabel">話すきっかけ(答えなくてかまいません)</div>
      <div id="qtext" class="qtext"></div>
      <button id="qnext" class="qdrop" type="button" aria-label="別のきっかけを出す">↻</button>
    </div>

    <textarea id="writeText" placeholder="マイクを押して話すか、ここに書く"></textarea>
    <div class="nlhint" data-hint-for="writeText" hidden>↵ 改行しました。次の言葉は新しい行から入ります</div>
    <div class="ops">
      <div class="micwrap">
        <button class="mic" type="button" data-mic-for="writeText" aria-label="音声入力"></button>
        <span class="micstate" data-state-for="writeText">停止中</span>
      </div>
      <button id="writeSave" type="button">保存</button>
      <div class="opsright">
        <button class="sub nl" type="button" data-nl-for="writeText">改行</button>
        <button id="writeCancel" class="link" type="button" hidden>やめる</button>
      </div>
    </div>

    <h2 class="sec">今日の出来事</h2>
    <div id="todayList" class="entries"></div>
  </section>

  <!-- 閲覧 -->
  <section id="view-browse" class="view" hidden>
    <input id="searchInput" type="search" placeholder="キーワードで検索" autocomplete="off">
    <div id="searchResults" class="results" hidden></div>
    <div id="calendarWrap">
      <div class="calhead">
        <button id="calPrev" class="link" type="button" aria-label="前の月">‹</button>
        <span id="calTitle"></span>
        <button id="calNext" class="link" type="button" aria-label="次の月">›</button>
      </div>
      <div id="calGrid" class="cal"></div>
    </div>
    <div id="dayView" class="dayview"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabs">
  <button id="tabWrite" data-tab="write" type="button"><span class="ticon" id="tabWriteIcon"></span><span>記入</span></button>
  <button data-tab="browse" type="button"><span class="ticon" data-icon="calendar"></span><span>閲覧</span></button>
  <button data-tab="settings" type="button"><span class="ticon" data-icon="gear"></span><span>設定</span></button>
  <button id="backBtn" type="button" disabled><span class="ticon" data-icon="back"></span><span>戻る</span></button>
</nav>

<div id="toast" class="toast" hidden></div>

<!-- Googleの接続が切れているときに、開いたところで同期するか尋ねる -->
<div id="syncAsk" class="ask" hidden>
  <div class="askbox">
    <p class="asktitle">Googleに接続して同期しますか?</p>
    <p class="note" id="syncAskNote"></p>
    <div class="askbtns"><button id="syncAskYes" type="button">はい</button><button id="syncAskNo" class="sub" type="button">いいえ</button></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
