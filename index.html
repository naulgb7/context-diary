<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コンテキスト日記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2f6f8f">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <span class="title">コンテキスト日記</span>
  <button id="syncBtn" class="sync" type="button">…</button>
</header>

<main>
  <div id="browserNotice" class="notice" hidden>
    いまSafariの中で開いています。ここで書いた内容や問いは、ホーム画面の「日記」アイコンのアプリとは別に保存されます。ホーム画面の「日記」アイコンから開き直してください。
  </div>
  <!-- 記入 -->
  <section id="view-write" class="view">
    <div id="summaryBar" hidden>
      <button id="summaryOpen" class="sub wide" type="button">1日のまとめを書く</button>
    </div>

    <div id="qcard" class="qcard">
      <div class="qlabel">問い</div>
      <div id="qtext" class="qtext"></div>
      <button id="qdrop" class="qdrop" type="button" aria-label="問いを外して自由に書く">×</button>
    </div>
    <div id="qfree" class="qfree" hidden>
      問いなし(自由記入)
      <button id="qrestore" class="link" type="button">問いを出す</button>
    </div>

    <textarea id="writeText" placeholder="マイクを押して話すか、ここに書く"></textarea>
    <div class="nlhint" data-hint-for="writeText" hidden>↵ 改行しました。次の言葉は新しい行から入ります</div>
    <div class="ops">
      <div class="micwrap">
        <button class="mic" type="button" data-mic-for="writeText" aria-label="音声入力"></button>
        <span class="micstate" data-state-for="writeText">停止中</span>
      </div>
      <button id="writeSave" type="button">保存</button>
      <div class="opsright">
        <button class="sub nl" type="button" data-nl-for="writeText">改行</button>
        <button id="writeCancel" class="link" type="button" hidden>やめる</button>
      </div>
    </div>

    <h2 class="sec">今日のメモ</h2>
    <div id="todayList" class="entries"></div>
  </section>

  <!-- 1日のまとめ -->
  <section id="view-summary" class="view" hidden>
    <div class="sumhead">
      <span class="sumtitle">1日のまとめ</span>
      <span id="sumPos" class="sumpos"></span>
    </div>
    <div class="qcard"><div class="qlabel">1日のまとめ</div><div id="sumQ" class="qtext"></div></div>
    <textarea id="sumText" placeholder="マイクを押して話すか、ここに書く"></textarea>
    <div class="nlhint" data-hint-for="sumText" hidden>↵ 改行しました。次の言葉は新しい行から入ります</div>
    <div class="ops">
      <div class="micwrap">
        <button class="mic" type="button" data-mic-for="sumText" aria-label="音声入力"></button>
        <span class="micstate" data-state-for="sumText">停止中</span>
      </div>
      <div></div>
      <div class="opsright"><button class="sub nl" type="button" data-nl-for="sumText">改行</button></div>
    </div>
    <div class="sumnav">
      <button id="sumPrev" class="sub" type="button">戻る</button>
      <button id="sumNext" type="button">次へ</button>
    </div>
    <p class="hint">答えたくない問いは、空欄のまま「次へ」で飛ばせます。後から戻って答えられます。</p>
  </section>

  <!-- 閲覧 -->
  <section id="view-browse" class="view" hidden>
    <input id="searchInput" type="search" placeholder="キーワードで検索" autocomplete="off">
    <div id="searchResults" class="results" hidden></div>
    <div id="calendarWrap">
      <div class="calhead">
        <button id="calPrev" class="link" type="button" aria-label="前の月">‹</button>
        <span id="calTitle"></span>
        <button id="calNext" class="link" type="button" aria-label="次の月">›</button>
      </div>
      <div id="calGrid" class="cal"></div>
    </div>
    <div id="dayView" class="dayview"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view" hidden></section>
</main>

<nav class="tabs">
  <button id="tabWrite" data-tab="write" type="button"><span class="ticon" id="tabWriteIcon"></span><span>記入</span></button>
  <button data-tab="browse" type="button"><span class="ticon" data-icon="calendar"></span><span>閲覧</span></button>
  <button data-tab="settings" type="button"><span class="ticon" data-icon="gear"></span><span>設定</span></button>
  <button id="backBtn" type="button" disabled><span class="ticon" data-icon="back"></span><span>戻る</span></button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
